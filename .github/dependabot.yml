version: 2

updates:
  # Update npm packages
  - package-ecosystem: npm
    directory: /
    open-pull-requests-limit: 15

    schedule:
      interval: monthly
      time: '10:30'
      timezone: 'Europe/London'

    cooldown:
      default-days: 7

    versioning-strategy: increase

  # Update GitHub Actions
  - package-ecosystem: github-actions
    directory: /

    schedule:
      interval: monthly
      time: '10:30'
      timezone: 'Europe/London'

    cooldown:
      default-days: 7